# HoloOcean 桥接参数（MTC 规划结果经 trajectory_to_agent_bridge 转发到 HoloOcean 执行）
arm_sensor_to_joint_state:
  ros__parameters:
    arm_sensor_topic: "/holoocean/rov0/ArmSensor"
    joint_states_topic: "joint_states"
    joints_in_degrees: true
    publish_frame_id: "arm_base_link"
    # 发布 left_arm_gripped 供 MTC 动态抓取时等待“抓稳/松开”（须与 MTC 订阅一致：/manipulator/left_arm_gripped）
    gripped_topic: "/manipulator/left_arm_gripped"

# Web 侧 joint_states 中继（降频专用，降低 rosbridge 与浏览器压力；MoveIt/MTC 仍读原始 /joint_states）
joint_state_web_relay:
  ros__parameters:
    input_topic: "/joint_states"
    output_topic: "/manipulator/web/joint_states"
    publish_rate_hz: 15.0

# MTC 执行目标：arm_controller / hand_controller 的 FollowJointTrajectory 由此节点提供并转为 AgentCommand
trajectory_to_agent_bridge:
  ros__parameters:
    agent_command_topic: "/holoocean/command/agent/arm"
    agent_frame_id: "rov0"
    publish_rate_hz: 50.0

# TargetSensor 世界系 xyz + direction → arm_base_link 下 object_pose（MTC 抓取）+ perception_state（旧多目标逻辑，可选）
target_sensor_to_object_pose:
  ros__parameters:
    target_sensor_topic: "/holoocean/rov0/TargetSensor"
    rov_pose_topic: "/holoocean/rov0/PoseSensor"
    object_pose_topic: "/manipulator/object_pose"
    object_pose_targetsensor_topic: "/manipulator/object_pose_targetsensor"
    object_axis_topic: "/manipulator/object_axis"
    perception_state_topic: "/manipulator/perception_state"
    target_set_topic: "/manipulator/target_set"
    target_insert_holes_topic: "/manipulator/target_insert_holes"
    world_frame_id: "map"
    # 与 sealien_ctrlpilot_location 同跑时务必 false，避免 /tf 上 rov0→arm_base_link 与同事 odom→base_link(ROV) 冲突
    publish_tf: false
    output_frame_id: "arm_base_link"
    target_index: 1
    use_left_arm: true
    left_arm_base_in_rov_x: 1.55
    left_arm_base_in_rov_y: 0.5653
    left_arm_base_in_rov_z: -0.283628
    right_arm_base_in_rov_x: 1.55
    right_arm_base_in_rov_y: -0.5653
    right_arm_base_in_rov_z: -0.283628
    position_offset_x: 0.0
    position_offset_y: 0.0
    position_offset_z: 0.0
    # 抓取点沿目标 direction 轴向偏移 [m]；TargetSensor 给的是关键点，需平移到把柄中点。
    # 当前标定：关键点到把柄起点 0.042671 m，把柄长 0.16 m，优先夹持中点(0.08 m)。
    # 因此默认偏移 = 0.042671 + 0.08 = 0.122671 m。
    grasp_offset_along_direction_m: 0.122671
    # false：map→rov0 与 perception 用节点时钟，避免 HoloOcean 重启后仿真时间回退导致 TF_OLD_DATA
    use_pose_sensor_stamp_for_rov_tf: false
    # 固定3插孔：world/map 坐标；节点内按 world->rov->arm_base_link 链路转换后发布。
    targetsensor_slot_1_position_world: [-162.649, 85.66733, -131.1388]
    targetsensor_slot_1_orientation_world: [0.0, 0.0, -0.70710678, 0.70710678]
    targetsensor_slot_2_position_world: [-162.649, 85.43484, -131.1388]
    targetsensor_slot_2_orientation_world: [0.0, 0.0, -0.70710678, 0.70710678]
    targetsensor_slot_3_position_world: [-162.649, 85.20445, -131.1388]
    targetsensor_slot_3_orientation_world: [0.0, 0.0, -0.70710678, 0.70710678]
    # 孔位旁面板：与 panel_obstacles_mtc_fragment.yaml 同目录；pick_holoocean 会合并进本节点与 sealien_ctrlpilot_manipulator_orion_mtc_node。

# CableSensor（单缆绳：位置+轴向+欧拉角）→ object_pose + TF arm_base_link→cable
# 话题 /holoocean/rov0/CableSensor；消息类型 holoocean_interfaces/msg/CableSensor；仅支持 num_cables=1
# 注意：部分数据源虽然 header.frame_id=COM，但 positions 实际给的是 map/world 坐标（接近 ROV(map)）。
cable_sensor_to_object_pose:
  ros__parameters:
    cable_sensor_topic: "/holoocean/rov0/CableSensor"
    rov_pose_topic: "/holoocean/rov0/PoseSensor"
    object_pose_topic: "/manipulator/object_pose"
    object_pose_cable_topic: "/manipulator/object_pose_cable"
    object_axis_topic: "/manipulator/object_axis"
    perception_state_topic: "/manipulator/perception_state"
    world_frame_id: "map"
    # 与 sealien_ctrlpilot_location 同跑时务必 false，避免 /tf 上 rov0→arm_base_link 与同事 odom→base_link(ROV) 冲突
    publish_tf: false
    output_frame_id: "arm_base_link"
    use_left_arm: true
    left_arm_base_in_rov_x: 1.55
    left_arm_base_in_rov_y: 0.5653
    left_arm_base_in_rov_z: -0.283628
    right_arm_base_in_rov_x: 1.55
    right_arm_base_in_rov_y: -0.5653
    right_arm_base_in_rov_z: -0.283628
    position_offset_x: 0.0
    position_offset_y: 0.0
    position_offset_z: 0.0
    # 缆绳传感器数据：全部为 world/map 坐标系（与 ROV(map) 接近）
    cable_frame_is_com: false
    cable_positions_frame: "world"
    cable_direction_frame: "world"
    cable_euler_frame: "world"
    use_pose_sensor_stamp_for_rov_tf: false

# 插孔段插头相对孔位姿（world model s_t；几何与 peg_insert 一致）
insert_relative_state:
  ros__parameters:
    output_topic: "/manipulator/insert_rel_state"
    target_insert_holes_topic: "/manipulator/target_insert_holes"
    target_set_topic: "/manipulator/target_set"
    task_stage_topic: "/manipulator/task_stage"
    base_frame: "arm_base_link"
    peg_frame: "peg_tip"
    hole_index: 0
    publish_rate_hz: 50.0
    start_stage_name: "move to pre-insert"
    end_stage_name: "open hand"
    insert_axis_local_xyz: [0.0, -1.0, 0.0]
    peg_rod_axis_tcp_xyz: [0.0, 1.0, 0.0]
