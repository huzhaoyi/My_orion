# =============================================================================
# orion_mtc 应用参数（抓取几何 + 可行性 + 运行策略）
# 由 pick_holoocean.launch.py 经 load_composable_node / 参数文件合并注入 orion_mtc_node。
# 历史：原 pick_params.yaml 与 runtime_policy.yaml 已合并为本单文件。
#
# 下列仅被 launch 读取、不进入 orion_mtc_node 的参数见文件末尾：
#   use_joy_manipulator、start_rviz。
#
# 同步提示：feasibility 径向/z 与网页展示一致时，需同时维护
#   web/js/data/feasibilityWorkspace.js、docs/workspace_limits.md。
# 感知侧目标偏置（关键点融合 z/姿态、HoloOcean sensor→object_pose）不在本文件，
#   见 keypoint_arm_tf.launch.py、holoocean_bridge_params.yaml。
# =============================================================================

# ---------- 抓取规划（MTCConfig：载入 mtc_config.cpp / TaskManager / Pick 链）----------
# 臂姿“扭曲”、IK 解不自然时排查顺序：
# 1) orion_description/urdf/orion.urdf：关节 origin/axis/limit、零位与 SRDF ready；
# 2) orion_moveit_config/config/joint_limits.yaml：实机建议补全 has_position_limits/min/max；
# 3) 多解肘态：可试 TRAC-IK、path_constraints 或缩小关节搜索包络。

# 夹持点沿缆绳/物体轴向相对几何中心的偏移 [m]（规划附着与 scene 用）；
# 正方向为物体/缆绳局部 +Z（电缆轴向定义见 Pick 构建）；0 表示落在中心。
grasp_offset_along_axis: 0.0

# 缆绳侧向抓取：多维候选 + 简化缆段碰撞包络（细缆绳场景可保留默认数量级）。
cable_side_grasp:
  # 侧向接近法向符号：+1 为默认几何；仿真若出现“从下往上顶缆绳夹”，可改为 -1 翻转到另一侧接近。
  approach_normal_sign: -1.0
  # 预抓阶段沿接近方向相对 grasp 的额外距离候选 [m]（由小到大多候选尝试）。
  pregrasp_offset_candidates: [0.030, 0.040, 0.050]
  # 闭合前指尖沿接近方向吃进缆绳的深度候选 [m]。
  grasp_depth_candidates: [0.010, 0.015, 0.020]
  # 预抓位与缆轴的侧向距离候选 [m]（由远到近）。
  approach_dist_candidates: [0.10, 0.08, 0.06, 0.04]
  # 相对 gripper_tcp 的姿态偏置 [deg]，顺序 roll/pitch/yaw，用于抓姿“夹爪补偿”微调。
  tcp_bias_rpy_deg: [0.0, 0.0, 0.0]
  # 抓取后撤回沿接近反方向的位移 [m]。
  retreat_dist: 0.05
  # 沿缆轴平移 grasp 中心候选 [m]（与 grasp 点沿缆绳对中微调）。
  axial_shift_candidates: [-0.05, 0.0, 0.05]
  # 腕部绕接近轴滚转候选 [deg]（侧向姿态多解）。
  roll_candidates_deg: [0.0]
  # 绕缆轴向旋转接近方向的候选 [deg]（保留 0~180，去除大角度冗余候选）。
  approach_around_axis_candidates_deg: [0.0, 45.0, 90.0, 135.0, 180.0]
  # 缆绳总长、分段长度、半径 [m]：用于生成线股碰撞原语（非精细网格）。
  cable_total_length: 3.0
  cable_segment_length: 0.25
  cable_radius: 0.025
  # 抓取点邻近±几段参与碰撞粗模。
  grasp_neighbor_segments: 1
  # Pilz/接近段线速度、线加速度相对默认的缩放系数（0~1 常用）。
  approach_lin_velocity_scaling: 0.12
  # Pilz/接近段线加速度缩放系数（0~1，越小越平滑）。
  approach_lin_acceleration_scaling: 0.06

# TargetSensor 抓取杆体：接近方向符号与上列 cable_side_grasp.approach_normal_sign 语义一致（HO 常需 -1）。
target_sensor_pick:
  # 接近方向符号（+1/-1），用于修正 peg 顶抓方向。
  approach_normal_sign: -1.0
  # 抓取接近轴（物体局部轴）：0->X, 1->Y, 2->Z。
  # 现场标定：target 坐标轴与机械臂一致，抓取按局部 X 轴定义更稳定。
  approach_axis_local: 0
  # 抓取接近轴候选（按顺序优先尝试）：顶部(Z)优先，其次前后(X)与侧向(Y)兜底。
  approach_axis_local_candidates: [2, 0, 1]
  # 是否按目标距离动态切换接近轴优先级。
  dynamic_axis_priority_enable: true
  # 近距离上限 [m]：<=near_max 用 near 顺序；>near_max 且 <=mid_max 用 mid；>mid_max 用 far。
  # 依据机械臂臂展量级（约 1.6m）划分：近距(0~0.55) 中距(0.55~1.10) 远距(>1.10)。
  dynamic_axis_near_max_distance_m: 0.55
  dynamic_axis_mid_max_distance_m: 1.10
  # 近距离：顶部下压优先，再前向，再侧向。
  dynamic_axis_near_order: [2, 0, 1]
  # 中距离：前向与顶部并重，先前向再顶部。
  dynamic_axis_mid_order: [0, 2, 1]
  # 远距离：前向优先，再顶部，再侧向。
  dynamic_axis_far_order: [0, 2, 1]
  # 低高度覆盖：当目标 z <= 阈值时，用 low_z 顺序覆盖按距离选出的轴顺序。
  dynamic_axis_priority_by_z_enable: true
  dynamic_axis_low_z_threshold_m: -0.15
  dynamic_axis_low_z_order: [0, 2, 1]
  # 低高度专项候选池：仅在 z <= dynamic_axis_low_z_threshold_m 时启用，收紧候选组合减少无效 IK 搜索。
  low_z_specialized_candidates_enable: true
  # 仅保留最短 N 个预抓距（<=0 表示不裁剪）。
  low_z_pregrasp_keep_count: 4
  # 低高度专项接近符号候选（空则沿用 approach_sign_candidates）。
  low_z_sign_candidates: [1.0, -1.0]
  # 低高度专项绕接近轴滚转候选 [deg]（优先小角度，缩短搜索链）。
  low_z_roll_candidates_deg: [0.0, 15.0, -15.0]
  # 从目标中心沿接近反方向退让到“表面附近”的距离 [m]；杆体优先从中段贴近，避免腕部抢前。
  surface_backoff_m: 0.05
  # 闭合前沿接近方向的“吃入深度” [m]。
  grasp_depth_m: 0.015
  # 预抓取距离候选 [m]（主序列；会与 fallback_pregrasp_distances_m 合并去重后尝试）。
  # 说明：深 z 场景下通常需要更远预抓以保证腕部可达，保留到 0.42m 的远距候选。
  pregrasp_distances_m: [0.06, 0.08, 0.10, 0.12, 0.14, 0.16, 0.18, 0.20, 0.24, 0.30, 0.36, 0.42]
  # 额外预抓回退候选 [m]（近距微调 + 中远距兜底）。
  fallback_pregrasp_distances_m: [0.03, 0.04, 0.05, 0.26, 0.34, 0.40]
  # 接近方向符号候选：顶部优先阶段先尝试主侧，失败后自动试另一侧。
  approach_sign_candidates: [-1.0, 1.0]
  # 是否根据目标 base_link.y 动态调整 sign 优先级（减少无效候选）。
  dynamic_sign_priority_enable: true
  # 目标 y<0 时优先 sign（当前场景统计更易命中 +1）。
  preferred_sign_for_negative_y: 1.0
  # 目标 y>=0 时优先 sign。
  preferred_sign_for_positive_y: -1.0
  # 绕接近轴滚转候选 [deg]：小角度优先，保留中角度兜底。
  tool_roll_candidates_deg: [0.0, 15.0, -15.0, 30.0, -30.0, 45.0, -45.0]
  # 抓取完成后退让距离 [m]。
  retreat_distance_m: 0.12

# TargetSensor 插孔：目标位姿由 submit_job 直接提供（建议 frame_id=base_link）。
peg_insert:
  # 轴向预插入距离 [m]（从孔位沿插入轴反向退让，作为 axis_pre_pose）。
  pre_offset_m: 0.04
  # true：插孔前先回 ready，减少抓取末态引起的绕行与换肘态。
  go_ready_before_insert: true
  # true：先到孔前方更远处的前置点，再直线推进到 pre-insert，减少“绕到孔后再回来”。
  enable_front_waypoint: true
  # true：前置点按 base_link X 轴生成（x = hole_x - front_waypoint_base_x_offset_m，y/z 与孔位一致）。
  front_waypoint_use_base_x: true
  # base_link X 轴前置距离 [m]（front_waypoint_use_base_x=true 时生效）。
  front_waypoint_base_x_offset_m: 0.35
  # true：pre-insert 先保持 base_link X 安全距离，避免对准阶段直接贴孔。
  pre_insert_use_base_x: true
  # pre-insert 的 base_link X 退让距离 [m]（pre_insert_use_base_x=true 时生效）。
  pre_insert_base_x_offset_m: 0.24
  # 前置点相对 pre-insert 继续沿 -insert_axis 退让距离 [m]。
  front_waypoint_offset_m: 0.10
  # 插入总深度 [m]（建议结合 latch 结果与实物孔深标定）。
  insert_depth_m: 0.18
  # 插入完成后沿 base_link +Z 线性抬离总距离 [m]（用于脱离孔口后再回 ready）。
  retreat_m: 0.08
  # 插入轴在孔位局部系下的方向（会归一化）：当前按 +Y 定义以匹配“沿 X 方向插入”的现场标定。
  insert_axis_local_xyz: [0.0, -1.0, 0.0]
  # 仅绕插入轴旋转末端姿态 [deg]（不改变插入方向）。
  tool_roll_about_insert_axis_deg: 0.0
  # 相对 gripper_tcp 的局部姿态偏置 [deg]（roll/pitch/yaw）；用于“像转 link5 一样”微调朝向。
  tool_rpy_offset_deg: [0.0, 0.0, 180.0]
  # 插孔段 Pilz 线速度缩放（越小越稳）。
  lin_velocity_scaling: 0.08
  # 插孔段 Pilz 线加速度缩放（越小越稳）。
  lin_acceleration_scaling: 0.03
  # CartesianPath 速度缩放（insert approach / descend / retreat 段使用）。
  cartesian_velocity_scaling: 0.08
  # CartesianPath 加速度缩放（insert approach / descend / retreat 段使用）。
  cartesian_acceleration_scaling: 0.04
  # CartesianPath 采样步长 [m]（越小轨迹越密，规划更慢）。
  cartesian_step_size: 0.005
  # 倒角阶段平面微动（无力控时的几何搜索）；默认关，需时在仿真中扫参再开。
  enable_chamfer_plane_search: false
  # 倒角平面微动步长 [m]（enable_chamfer_plane_search=true 时生效）。
  chamfer_plane_delta_m: 0.002
  # 插入轴向分段数（>1 可降低“单段硬推进”导致的穿入风险）。
  insert_axial_segments: 5
# 物体/缆绳位姿来源为 ROS 话题（如 /manipulator/object_pose），不在此文件配置。
# 动态抓取：夹爪段不强制全程闭合；闭合后由 /manipulator/left_arm_gripped 等判定抓稳。

# ---------- 夹爪反馈判定（waitForGripped）----------
gripper_feedback:
  # 夹紧判定阈值：left_arm_gripped >= lock_threshold 视为抓稳。
  lock_threshold: 0.5
  # 松开判定阈值：left_arm_gripped < unlock_threshold 视为已松开（低于 lock 阈值形成滞回）。
  unlock_threshold: 0.45
  # 闭爪段后等待夹持反馈的最长时间 [s]（会与代码内调用超时取最大值）。
  wait_timeout_sec: 8.0
  # 闭爪轨迹完成后先等待机械/仿真稳定，再开始判定 [s]。
  settle_delay_sec: 1.0
  # 反馈采样频率 [Hz]（waitForGripped 轮询频率）。
  poll_hz: 20.0
  # 连续满足阈值的样本数，达到后才判定成功，抑制瞬时抖动误判。
  consecutive_samples: 3

# ---------- 可行性审批（FeasibilityChecker：check_pick / 入队前工作空间）----------
# 几何参考：orion_description/urdf/orion.urdf，末端为 gripper_tcp（与 MoveIt IK 一致，不含开合爪）。
# 全包络量级（base_link）：|p|_max≈1.85 m，|p|_min≈0.02 m，z 约 [-1.82, 1.83] m。
# 下列为操作包络：校核的是目标点（物体/缆绳中心）相对基座的距离与高度，不是 TCP。
feasibility:
  # 径向 ‖p‖ 硬上限 [m]：超过则拒绝（WORKSPACE）；略低于 URDF 统计最大以留 IK/奇异/侧抓余量。
  max_reach_hard: 1.90
  # 软上限 [m]：‖p‖ 介于 soft~hard 时通过但告警（可执行但接近边界）。
  max_reach_soft: 1.66
  # 径向 ‖p‖ 安全下限 [m]：过近拒绝，缓解折叠自碰与病态 IK。
  min_reach_safe: 0.14
  # 目标点 base_link z [m] 允许下限（经验包络，窄于 URDF 极端 z）。
  z_min: -1.14
  # 目标点 base_link z [m] 允许上限。
  z_max: 1.85
  # 主动关节距 URDF 限位小于该值 [rad] 时审批给出关节余量警告。
  joint_margin_warning_rad: 0.10
  # 审批用 IK 单次超时 [s]。
  ik_timeout: 0.2
  # 接近方向与竖直向下夹角超过该值 [deg] 则提示姿态风险。
  approach_angle_max_deg: 55.0
  # 审批失败时建议微调目标的步长 [m] / [rad]（日志与提示用）。
  suggestion_perturb_xy: 0.02
  suggestion_perturb_z: 0.03
  suggestion_perturb_yaw_rad: 0.15
  # 手柄自动/手动话题（须与 orion_joy_arm_bridge 发布名一致）。
  joy_manual_mode_topic: "/joy_manipulator/manual_mode"
  # 模式切换边沿后跳过 IK 审批与缆绳预检的时间窗 [s]，避免 joint_states 未稳误拒。
  joy_mode_switch_ik_skip_sec: 1.5
  # 非空时：审批链拉 planning_scene 做自碰/环境碰检测（服务全名）；默认 "" 关闭。
  get_planning_scene_service: ""

# ---------- 运行策略（TaskManager / worker / 入队过滤）----------
runtime_policy:
  # launch 后是否自动起 worker 消费队列。
  auto_start_worker: true
  # 规划失败是否对同一任务自动重试（与 max_retries 配合）。
  retry_on_plan_failure: false
  # 同一任务最大自动重试次数（retry_on_plan_failure=true 时生效）。
  max_retries: 1
  # SYNC 等前是否先清 scene 再同步（减少陈旧碰模型）。
  auto_clear_scene_before_sync: true
  # 轨迹执行失败后是否自动 reset 场景/状态（具体行为见 TaskManager）。
  auto_reset_after_execution_failure: true
  # 失败后是否自动 go_home（回 ready）；false 时常配合人工介入。
  auto_go_home_after_failure: false
  # true：worker 忙时拒绝新 SubmitJob（策略门控）。
  reject_new_jobs_while_busy: false

# ---------- 仅 pick_holoocean.launch.py 使用（不注入 orion_mtc_node）----------
# true：默认再启动 orion_joy_arm_bridge（/left_joy、/right_joy）。
use_joy_manipulator: true
# true：启动 RViz；默认 false 便于无头仿真与网页联调。
start_rviz: false
